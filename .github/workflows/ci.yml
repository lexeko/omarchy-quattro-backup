name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: |
          bash -n backup-before-quattro.sh
          bash -n tests/run.sh

      - name: Run ShellCheck
        run: shellcheck backup-before-quattro.sh tests/run.sh

      - name: Run tests
        run: tests/run.sh
